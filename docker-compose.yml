services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-spina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spina}
      POSTGRES_DB: ${DB_NAME:-intifada_development}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - intifada_postgres_data:/var/lib/postgresql/data

volumes:
  intifada_postgres_data:
